<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#42AC35">
    <meta name="description" content="Помічник для початку навчання в NOVUS">
    <title>Розпочни своє навчання в NOVUS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body class="is-loading">
    <div id="appLoader" class="app-loader" role="status" aria-live="polite">
      <div class="loader-overlay"></div>
      <div class="loader-panel">
        <div class="loader-spinner" aria-hidden="true"></div>
        <p id="loaderTitle" class="loader-title">Завантажуємо помічник</p>
        <div class="loader-progress" aria-hidden="true">
          <span id="loaderProgressBar"></span>
        </div>
        <p id="loaderProgressText" class="loader-percent">0%</p>
      </div>
    </div>
    <div class="app-shell">
      <main id="app" class="app-main" tabindex="-1"></main>
      <a id="helpButton" class="help-button" href="#" aria-label="Зателефонувати адміністратору">
        <span aria-hidden="true">☎</span>
        <span>Допомога</span>
      </a>
    </div>
    <div id="modalRoot"></div>
  </body>
</html>
